<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicaplus Gaming - Próximamente</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #060409;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* FONDO 1: Cuadrícula con perspectiva Gaming / Cyberpunk */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(88, 28, 126, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88, 28, 126, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            z-index: 1;
        }

        /* FONDO 2: Luces difuminadas de neón en constante movimiento */
        .bg-glows {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .glow-1, .glow-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: #b002c2;
            top: -10%;
            left: -10%;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            background: #047688;
            bottom: -15%;
            right: -10%;
            animation-delay: -4s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.2); }
        }

        /* FONDO 3: Aura principal detrás de la tarjeta */
        .main-pulse {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(176, 2, 194, 0.25) 0%, rgba(4, 118, 136, 0.05) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            animation: radicalPulse 4s infinite ease-in-out;
        }

        @keyframes radicalPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* Tarjeta principal con mejor contraste y bordes de neón */
        .container {
            background: rgba(13, 10, 18, 0.75);
            border: 1px solid rgba(176, 2, 194, 0.25);
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 480px;
            width: 90%;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 
                        0 0 40px rgba(176, 2, 194, 0.1);
            z-index: 4;
            animation: initCard 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes initCard {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Wrapper del Logo de la imagen `image_082ffe.png` */
        .logo-wrapper {
            background-color: #FFFFFF;
            padding: 22px;
            border-radius: 18px;
            display: inline-block;
            margin-bottom: 35px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4),
                        0 0 20px rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo-wrapper:hover {
            transform: scale(1.05) rotate(1deg);
        }

        .logo-img {
            max-width: 100%;
            height: auto;
            display: block;
            max-height: 140px;
        }

        h1 {
            color: #FFFFFF;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .divider {
            height: 3px;
            width: 80px;
            margin: 22px auto;
            background: linear-gradient(90deg, #581c7e, #b002c2, #047688);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: scanLight 2.5s infinite linear;
        }

        @keyframes scanLight {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        p {
            color: #c4c1ca;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .badge {
            display: inline-block;
            padding: 8px 20px;
            background-color: rgba(4, 118, 136, 0.1);
            border: 1px solid #047688;
            color: #047688;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(4, 118, 136, 0.2);
            animation: pulseBadge 1.5s infinite alternate ease-in-out;
        }

        @keyframes pulseBadge {
            from { transform: scale(1); box-shadow: 0 0 10px rgba(4, 118, 136, 0.2); }
            to { transform: scale(1.03); box-shadow: 0 0 20px rgba(4, 118, 136, 0.6); }
        }
    </style>
</head>
<body>

    <!-- Capas de diseño para el fondo vivo -->
    <div class="bg-grid"></div>
    <div class="bg-glows">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>
    <div class="main-pulse"></div>

    <!-- Contenedor de Información -->
    <div class="container">
        <div class="logo-wrapper">
            <!-- Renderiza tu archivo image_082b85.png aquí -->
            <img src="logo.png" alt="Nicaplus Gaming" class="logo-img">
        </div>

        <h1>Próximamente</h1>
        
        <div class="divider"></div>
        
        <p>Estamos construyendo nuestra nueva plataforma interna y tienda digital. Volveremos pronto con un entorno optimizado para tus servicios.</p>
        
        <span class="badge">En Desarrollo</span>
    </div>

</body>
</html>
