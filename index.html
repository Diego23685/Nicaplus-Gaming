<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nicaplus Gaming - Próximamente</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Evita scroll a nivel global y fuerza el tamaño de la pantalla móvil (dvh) */
        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #060409;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* Contenedor aislado para los fondos animados para evitar que empujen el scroll */
        .background-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        /* FONDO 1: Cuadrícula con perspectiva Gaming */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(88, 28, 126, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88, 28, 126, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }

        /* FONDO 2: Luces difuminadas de neón */
        .bg-glows {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glow-1, .glow-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px); /* Reducido levemente para mejorar rendimiento en tablets/celulares */
            opacity: 0.35;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }

        .glow-1 {
            width: 300px;
            height: 300px;
            background: #b002c2;
            top: -5%;
            left: -5%;
        }

        .glow-2 {
            width: 350px;
            height: 350px;
            background: #047688;
            bottom: -5%;
            right: -5%;
            animation-delay: -4s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* FONDO 3: Aura principal detrás de la tarjeta */
        .main-pulse {
            position: absolute;
            width: 100%;
            max-width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(176, 2, 194, 0.22) 0%, rgba(4, 118, 136, 0.04) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: radicalPulse 4s infinite ease-in-out;
        }

        @keyframes radicalPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Tarjeta principal - Optimizada para no desbordar en pantallas pequeñas */
        .container {
            background: rgba(13, 10, 18, 0.82);
            border: 1px solid rgba(176, 2, 194, 0.25);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 440px;
            width: 88%;
            max-height: 90dvh; /* Evita que la tarjeta sea más alta que la pantalla del celular */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 
                        0 0 40px rgba(176, 2, 194, 0.1);
            z-index: 5;
            animation: initCard 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes initCard {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Wrapper del Logo */
        .logo-wrapper {
            background-color: #FFFFFF;
            padding: 15px 20px;
            border-radius: 18px;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.03);
        }

        .logo-img {
            max-width: 100%;
            height: auto;
            display: block;
            max-height: 110px; /* Tamaño controlado para pantallas móviles */
        }

        h1 {
            color: #FFFFFF;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .divider {
            height: 3px;
            width: 70px;
            margin: 15px auto;
            background: linear-gradient(90deg, #581c7e, #b002c2, #047688);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: scanLight 2.5s infinite linear;
        }

        @keyframes scanLight {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        p {
            color: #c4c1ca;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
            font-weight: 400;
            max-width: 360px;
        }

        .badge {
            display: inline-block;
            padding: 6px 18px;
            background-color: rgba(4, 118, 136, 0.1);
            border: 1px solid #047688;
            color: #047688;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(4, 118, 136, 0.15);
            animation: pulseBadge 1.5s infinite alternate ease-in-out;
        }

        @keyframes pulseBadge {
            from { transform: scale(1); }
            to { transform: scale(1.02); box-shadow: 0 0 15px rgba(4, 118, 136, 0.4); }
        }
    </style>
</head>
<body>

    <!-- Contenedor aislado de fondos -->
    <div class="background-wrapper">
        <div class="bg-grid"></div>
        <div class="bg-glows">
            <div class="glow-1"></div>
            <div class="glow-2"></div>
        </div>
        <div class="main-pulse"></div>
    </div>

    <!-- Contenedor de Información Estricto -->
    <div class="container">
        <div class="logo-wrapper">
            <img src="logo.png" alt="Nicaplus Gaming" class="logo-img">
        </div>

        <h1>Próximamente</h1>
        
        <div class="divider"></div>
        
        <p>Estamos construyendo nuestra nueva plataforma interna y tienda digital. Volveremos pronto con un entorno optimizado para tus servicios.</p>
        
        <span class="badge">En Desarrollo</span>
    </div>

</body>
</html>
